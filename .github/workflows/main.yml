name: TheLostPlace

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download Cods
        uses: actions/checkout@v4

      - name: Set Up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Permission Give Gradle
        run: chmod +x gradlew

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: wrapper

      - name: Compile Project
        run: ./gradlew build

      - name: Download The Compiled Project
        uses: actions/upload-artifact@v4
        with:
          name: TheLostPlace-Jar
          path: build/libs/*.jar
