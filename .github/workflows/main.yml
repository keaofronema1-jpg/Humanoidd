name: Build Minecraft Mod

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Kodları İndir
      uses: actions/checkout@v4

    - name: Java 17 Kur
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Gradle Yetkisi Ver
      run: chmod +x gradlew

    - name: Projeyi Derle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: wrapper
    - run: ./gradlew build

    - name: Derlenen Mod Dosyasını Kaydet (Artifact)
      uses: actions/upload-artifact@v4
      with:
        name: Humanoid-Mod-Jar
        path: build/libs/*.jar
